<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Apple Watch · OpenBlah mock</title>
    <link rel="stylesheet" href="../shared/base.css" />
    <style>
      .watch-stage {
        display: grid;
        place-items: center;
        padding: var(--ob-s6) var(--ob-s4);
        gap: var(--ob-s4);
      }
      .band {
        width: 150px;
        height: 40px;
        background: #1c2230;
      }
      .band.b {
        margin-top: -8px;
      }
      .case {
        width: 220px;
        height: 268px;
        border-radius: 56px;
        background: #000;
        border: 6px solid #2a3144;
        padding: 14px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .wscreen {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
        text-align: center;
        justify-content: center;
        font-size: 13px;
      }
      .wtime {
        position: absolute;
      }
      .wscreen b {
        font-size: 16px;
      }
      .wbtn {
        border: 0;
        border-radius: 999px;
        min-height: 44px;
        font-weight: 700;
        font-size: 15px;
        background: var(--ob-surface-2);
        color: var(--ob-text);
      }
      .wbtn.go {
        background: var(--ob-speaking);
        color: #04281d;
      }
      .wbtn.bad {
        background: var(--ob-danger);
        color: #2a0006;
      }
      .wbtn.on {
        background: var(--ob-warn);
        color: #2a1a00;
      }
      .wrow {
        display: flex;
        gap: 8px;
      }
      .wrow .wbtn {
        flex: 1;
      }
      .dot {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        margin: 0 auto;
        background: var(--ob-agent);
        display: grid;
        place-items: center;
        color: #1d0b3a;
      }
      .dot.thinking {
        background: none;
        border: 3px dashed var(--ob-agent);
        color: var(--ob-agent);
        animation: spin 2.4s linear infinite;
      }
      .dot.speaking {
        box-shadow: 0 0 0 6px rgba(180, 140, 255, 0.3);
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .wcap {
        color: var(--ob-text-dim);
        font-size: 11px;
        line-height: 1.3;
      }
    </style>
  </head>
  <body>
    <div class="watch-stage">
      <div class="band"></div>
      <div class="case" id="w"></div>
      <div class="band b"></div>
      <p class="small dim" style="max-width: 320px; text-align: center">
        Watch-sized frame (about 200×250). Join, mute and leave; the watch is a thin client and the
        logic stays on the server.
      </p>
    </div>
    <script src="../shared/mock.js"></script>
    <script>
      const { h, chrome } = OB;
      const s = { screen: "idle", agent: "listening", muted: false };
      const w = document.getElementById("w");
      function render() {
        let b;
        if (s.screen === "idle")
          b = [
            h("b", {}, "OpenBlah"),
            h("span", { class: "wcap" }, "Family chat is live · Mum, Maria"),
            h(
              "button",
              {
                class: "wbtn go",
                onclick: () => {
                  s.screen = "call";
                  render();
                  ui.redraw();
                },
              },
              "Join",
            ),
          ];
        else if (s.screen === "call") {
          const label = {
            listening: "Listening",
            thinking: "Thinking…",
            speaking: "Speaking",
            off: "AI off",
          }[s.agent];
          b = [
            h("div", { class: "dot " + s.agent }, s.agent === "off" ? "⏸" : "✦"),
            h("b", {}, "Blah"),
            h("span", { class: "wcap" }, label + (s.muted ? " · you're muted" : "")),
            h(
              "div",
              { class: "wrow" },
              h(
                "button",
                {
                  class: "wbtn" + (s.muted ? " on" : ""),
                  onclick: () => {
                    s.muted = !s.muted;
                    render();
                    ui.redraw();
                  },
                },
                s.muted ? "Unmute" : "Mute",
              ),
              h(
                "button",
                {
                  class: "wbtn bad",
                  onclick: () => {
                    s.screen = "ended";
                    render();
                    ui.redraw();
                  },
                },
                "Leave",
              ),
            ),
          ];
        } else
          b = [
            h("b", {}, "Call ended"),
            h("span", { class: "wcap" }, "Summary is in the app."),
            h(
              "button",
              {
                class: "wbtn",
                onclick: () => {
                  s.screen = "idle";
                  render();
                  ui.redraw();
                },
              },
              "Done",
            ),
          ];
        w.replaceChildren(h("div", { class: "wscreen" }, b));
      }
      const ui = chrome(
        "Apple Watch",
        [
          {
            key: "screen",
            label: "Screen",
            options: [
              ["idle", "Join"],
              ["call", "In call"],
              ["ended", "Ended"],
            ],
          },
          {
            key: "agent",
            label: "Agent state",
            options: [
              ["listening", "Listening"],
              ["thinking", "Thinking"],
              ["speaking", "Speaking"],
              ["off", "AI off"],
            ],
          },
          {
            key: "muted",
            label: "You",
            options: [
              [false, "Mic on"],
              [true, "Muted"],
            ],
          },
        ],
        s,
        render,
      );
      render();
    </script>
  </body>
</html>
