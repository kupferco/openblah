# Publishes the 0.x packages to npm. Runs by itself when a merge to main changes a
# package version (versions already on npm are skipped, then the commit is tagged),
# or by hand (Actions > Release), or when a tag like v0.1.0 is pushed.
# Needs the repo secret NPM_TOKEN (an automation token for the @openblah scope).
name: Release
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Dry run (build and pack, do not publish)
        type: boolean
        default: false
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["packages/*/package.json"]

permissions:
  contents: write # tag the release commit
  id-token: write # npm provenance

concurrency:
  group: release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Check the npm token
        if: github.event.inputs.dry-run != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo '::viber-manual::{"reason":"the repo secret NPM_TOKEN is not set","action":"Create the @openblah npm organisation (or confirm the scope), create an automation token, and add it as the repo Actions secret NPM_TOKEN on GitHub.","commands":[],"verify":"Re-run the Release workflow; the Check the npm token step passes."}'
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(node -p "require('./packages/web/package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match version $v"; exit 1; }
      - name: Dry run
        if: github.event.inputs.dry-run == 'true'
        run: pnpm --filter "@openblah/core" --filter "@openblah/web" --filter "@openblah/react-native" --filter "@openblah/server" publish --dry-run --no-git-checks
      - name: Publish (skips versions already on npm)
        if: github.event.inputs.dry-run != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          for dir in core web react-native server; do
            name=$(node -p "require('./packages/$dir/package.json').name")
            version=$(node -p "require('./packages/$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm, skipping"
            else
              echo "Publishing $name@$version"
              pnpm --filter "$name" publish --access public --no-git-checks
            fi
          done
      - name: Tag the release
        if: github.event.inputs.dry-run != 'true' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="v$(node -p "require('./packages/web/package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists, not tagging"
          else
            git tag "$tag"
            git push origin "$tag"
          fi
